# Runs the tests of the core of the app (tests/) on every push and pull request.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install the dependencies
        run: python -m pip install -r requirements.txt

      - name: Run the tests
        run: python -m unittest discover -s tests -t . -v
